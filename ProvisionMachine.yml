- name: Provision Machine
  hosts: monitoring_servers
  become: true
  vars:
    new_user: "offworld-admin"
    grafana_version: "13.2.2"

  tasks:
  - name: Hello World Message
    ansible.builtin.debug:
      msg: Hello World!

  - name: Create Human User
    ansible.builtin.user:
      name: "{{ new_user }}"
      password: "{{ new_user_password | password_hash('sha512')}}"
      shell: /bin/bash
      groups: sudo
      append: true

  - name: Install Docker repository prerequisites
    ansible.builtin.apt:
      name:
        - ca-certificates
        - curl
      state: present
      update_cache: true

  - name: Ensure apt keyring directory exists
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'

  - name: Download Docker repository signing key
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
      dest: /etc/apt/keyrings/docker.asc
      mode: '0644'

  - name: Add Docker apt repository
    ansible.builtin.apt_repository:
      repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
      filename: docker
      state: present
      update_cache: true

  - name: Install Docker Engine and Python SDK
    ansible.builtin.apt:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - python3-docker
      state: present
      update_cache: true
  
  # Testing that this inserted task doesn't break things. 
  - name: Insert Docker Daemon Template
    ansible.builtin.template:
      src: templates/docker-daemon.json.j2
      dest: /etc/docker/daemon.json
      mode: '0644'
    notify: Restart Docker

  - name: Enable and start Docker
    ansible.builtin.service:
      name: docker
      state: started
      enabled: true
    
  - name: Run Prometheus Node Exporter Container
    community.docker.docker_container:
      name: node-exporter
      image: prom/node-exporter:v1.12.1
      state: started
      restart_policy: unless-stopped
      network_mode: host
      command:
        - '--path.procfs=/host/proc'
        - '--path.sysfs=/host/sys'
        - '--path.rootfs=/host'
      volumes:
        - /proc:/host/proc:ro
        - /sys:/host/sys:ro
        - /:/host:ro,rslave

  - name: Ensure Grafana data volume exists
    community.docker.docker_volume:
      name: grafana-data
      state: present

  - name: Make directories for monotiring configurations
    ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      mode: '0755'
    loop:
      - /opt/monitoring
      - /opt/monitoring/grafana/provisioning/datasources
    
  - name: Install Prometheus Configuration
    ansible.builtin.template:
      src: templates/prometheus.yml.j2
      dest: /opt/monitoring/prometheus.yml
      mode: '0644'

  - name: Copy the Prometheus configuration into Grafana
    ansible.builtin.copy:
      src: templates/prometheus-datasource.yml
      dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
      mode: '0644'

  - name: create monitoring Docker network
    community.docker.docker_network:
      name: monitoring
      state: present

  - name: Start Prometheus Container
    community.docker.docker_container:
      name: prometheus
      image: prom/prometheus:3.15.0
      state: started
      restart_policy: unless-stopped
      ports:
        - "9090:9090"
      networks:
        - name: monitoring
      volumes:
        - /opt/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  
  - name: Start Grafana container
    community.docker.docker_container:
      name: grafana
      image: "grafana/grafana:{{ grafana_version }}"
      state: started
      restart_policy: unless-stopped
      ports:
        - "3000:3000"
      networks:
        - name: monitoring
      volumes:
        - grafana-data:/var/lib/grafana
        - /opt/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro


