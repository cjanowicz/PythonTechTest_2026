
  

  - name: Ensure target is Ubuntu or Debian
    ansible.builtin.assert:
      that:
        - ansible_distribution in ['Ubuntu', 'Debian']
      fail_msg: "Docker installation tasks currently support Ubuntu and Debian only."

  - name: Install Docker repository prerequisites
    ansible.builtin.apt:
      name:
        - ca-certificates
        - curl
      state: present
      update_cache: true

  - name: Ensure apt keyring directory exists
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'

  - name: Download Docker repository signing key
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
      dest: /etc/apt/keyrings/docker.asc
      mode: '0644'

  - name: Add Docker apt repository
    ansible.builtin.apt_repository:
      repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
      filename: docker
      state: present
      update_cache: true

  - name: Install Docker Engine and Python SDK
    ansible.builtin.apt:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - python3-docker
      state: present
      update_cache: true

  - name: Enable and start Docker
    ansible.builtin.service:
      name: docker
      state: started
      enabled: true