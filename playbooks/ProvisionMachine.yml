- name: Provision Machine
  hosts: monitoring_servers
  become: true
  vars:
    new_user: "offworld-admin"

  tasks:
  - name: Hello World Message
    ansible.builtin.debug:
      msg: Hello World!

  - name: Create Human User
    ansible.builtin.user:
      name: "{{ new_user }}"
      password: "{{ new_user_password | password_hash('sha512')}}"
      shell: /bin/bash
      groups: sudo
      append: true

  - name: Install Docker Requirements
    ansible.builtin.apt:
      name:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - lsb-release
      state: present
      update_cache: true

  # - name: Ensure Pip
  #   ansible.builtin.pip:
  #     name: requests
  #     state: present

  - name: Ensure Docker service is installed
    ansible.builtin.package:
      name: docker
      state: present

  - name: Make sure Docker service is running
    ansible.builtin.service:
      name: docker
      state: started
      enabled: true
  
