  #       {
  #         "metrics-addr": "0.0.0.0:9232",
  #         "experimental"
  #       }
  #   notify: restart docker
  
  # - name: Add new user to docker group
  #   ansible.builtin.user:
  #     name: "{{ new_user }}"
  #     groups: docker
  #     append: true

  
  - name: Print message
    ansible.builtin.debug:
      msg: All Done Provisioning
